services:
  monitor:
    build: .
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    environment:
      UNIFI_URL: '${UNIFI_URL:-}'
      UNIFI_API_KEY: '${UNIFI_API_KEY:-}'
      UNIFI_USERNAME: '${UNIFI_USERNAME:-}'
      UNIFI_PASSWORD: '${UNIFI_PASSWORD:-}'
      UNIFI_SITE: '${UNIFI_SITE:-default}'
      UNIFI_VERIFY_TLS: '${UNIFI_VERIFY_TLS:-true}'
      UNIFI_FIXTURE_MODE: '${UNIFI_FIXTURE_MODE:-false}'
      POLL_INTERVAL_SECONDS: '${POLL_INTERVAL_SECONDS:-0.5}'
      RETENTION_DAYS: '${RETENTION_DAYS:-30}'
      DATA_DIR: /data
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - networker_data:/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  networker_data:
