services:
  monitor:
    build:
      context: .
      target: dev
    image: networker-monitor-dev
    # Named node_modules starts empty or with host files; pnpm must be allowed
    # to replace it without a TTY confirmation prompt.
    command: >-
      sh -c "pnpm install --config.confirmModulesPurge=false && pnpm dev --host 0.0.0.0 --port 3000 --strictPort"
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: 'true'
    volumes:
      - .:/app
      - monitor_dev_node_modules:/app/node_modules
    healthcheck:
      start_period: 45s

volumes:
  monitor_dev_node_modules:
